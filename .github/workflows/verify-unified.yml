name: Verify and stage unified regression site

# Discard work on outdated branch commits; only the newest verified
# generated JSON may be committed for GitHub Pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feat/pearson-correlations-20261108
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install analysis and test packages
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Determine whether statistical data needs regeneration
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: full rebuild"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$BASE_SHA"
          else
            BASE="$BEFORE_SHA"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "Unknown base: safe full rebuild"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD > /tmp/changed-paths.txt
          cat /tmp/changed-paths.txt
          if grep -Eq '^(build\.py$|requirements\.txt$|Statistics/|\.github/workflows/)' /tmp/changed-paths.txt; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "Analysis inputs changed: full rebuild"
          else
            echo "full_build=false" >> "$GITHUB_OUTPUT"
            echo "UI, documentation or tests only: reuse checked-in statistics"
          fi
      - name: Existing and new regression tests
        run: python -m pytest tests -q
      - name: Regenerate entire static site offline from checked out CSVs
        if: steps.changes.outputs.full_build == 'true'
        run: python build.py
      - name: Verify generated unified index and model details
        if: steps.changes.outputs.full_build == 'true'
        run: |
          python - <<'PY'
          import json
          import gzip
          from pathlib import Path
          root=Path('site/data')
          manifest=json.loads((root/'unified_manifest.json').read_text(encoding='utf-8'))
          assert set(manifest['models']) == {'six','age65','under15','medical','premium','fertility','fiscal'}
          for key,definition in manifest['models'].items():
              idx=json.loads(gzip.decompress((root/f'unified_index_{key}.json.gz').read_bytes()))
              assert idx, key
              assert all(m['year']=='전기간' or m['year'] in definition['years'] for m in idx), key
              if key in ('six','medical','premium'):
                  assert 2014 not in definition['years']
                  assert not any(m['year']==2014 for m in idx)
              if key=='six':
                  assert all(len(m['coefficients'])==6 for m in idx)
              fitted=next((m for m in idx if m['intercept'] is not None),None)
              assert fitted is not None, key
              detail=json.loads(gzip.decompress((Path('site')/fitted['shard']).read_bytes()))[fitted['id']]
              assert detail['model']['n']==fitted['n']==len(detail['observations'])
              assert detail['model']['r2']==fitted['r2']
              assert detail['model']['adj_r2']==fitted['adj_r2']
              assert detail['model']['p_model']==fitted['p_model']
              assert len(fitted['correlations']) == (6 if key=='six' else 1)
              assert detail['correlations']['sample_n'] == fitted['n']
              assert detail['correlations']['method'] == 'pearson'
              assert detail['correlations']['library'] == 'scipy.stats.pearsonr'
              assert detail['correlations']['scipy_version']
              assert detail['correlations']['alternative'] == 'two-sided'
              assert len(fitted['correlation_pvalues']) == len(fitted['correlations'])
              fields=detail['model']['predictors']
              for i,field in enumerate(fields):
                  r=fitted['correlations'][i]
                  assert detail['correlations']['predictors'][field] == r
                  scipy_result = detail['correlations']['scipy'][field]
                  assert scipy_result['method'] == 'scipy.stats.pearsonr'
                  assert scipy_result['n'] == fitted['n']
                  assert scipy_result['statistic'] == r
                  assert scipy_result['pvalue'] == fitted['correlation_pvalues'][i]
                  assert scipy_result['alternative'] == 'two-sided'
                  assert scipy_result['confidence_level'] == 0.95
                  assert set(scipy_result['confidence_interval']) == {'low', 'high'}
                  if r is not None:
                      assert scipy_result['raw'].startswith('PearsonRResult(')
                      assert scipy_result['raw_confidence_interval'].startswith('ConfidenceInterval(')
                  else:
                      assert scipy_result['reason']
                  assert r is None or -1.00000000001 <= r <= 1.00000000001
              assert 'OLS Regression Results' in detail['model']['raw']
          # Independent facility density models, using exact source Q1 counts.
          fm=json.loads((root/'facility_manifest.json').read_text(encoding='utf-8'))
          assert set(fm['models']) == {
              'facility_tertiary','facility_general','facility_hospital',
              'facility_clinic','facility_psychiatric','facility_public_health'}
          assert len(list((root/'facility_detail').rglob('*.json.gz'))) == 6 * 17
          for key,cfg in fm['models'].items():
              ix=json.loads(gzip.decompress((root/f'facility_index_{key}.json.gz').read_bytes()))
              assert ix and all(row['year']=='전기간' or row['year'] in cfg['years'] for row in ix)
              assert cfg['field'].endswith('_per_100k')
              sample=next(row for row in ix if row['intercept'] is not None)
              detail=json.loads(gzip.decompress((Path('site')/sample['shard']).read_bytes()))[sample['id']]
              assert sample['n']==detail['model']['n']==len(detail['observations'])
              assert detail['columns'][-2:]==['facility_count_q1','population']
          assert len(list((root/'unified_detail').rglob('*.json.gz'))) == 7 * 17
          assert not list((root/'unified_detail').rglob('*.json'))
          assert not list(root.glob('unified_index_*.json'))
          site=Path('site')
          site_files=[p for p in site.rglob('*') if p.is_file()]
          total_bytes=sum(p.stat().st_size for p in site_files)
          assert len(site_files)<500, f'Pages has too many files: {len(site_files)}'
          # Existing seven models plus optional facility-density shards currently
          # require about 283 MB. Keep a 320 MB regression budget (well below
          # GitHub Pages' 1 GB published-site limit) without dropping data.
          assert total_bytes<320_000_000, f'Pages has too many bytes: {total_bytes}'
          print(f'PAGES PAYLOAD: {len(site_files)} files, {total_bytes:,} bytes')
          assert not list(root.glob('demographic_multi_models_*.json'))
          assert not list(root.glob('household_premium_multi_models_*.json'))
          print('UNIFIED MODEL, YEAR, SAMPLE, FULL OLS, AND OBSERVATION CHECKS: PASS')
          PY
      - name: JavaScript syntax check
        run: |
          node --check site/assets/js/unified.js
          node --check site/assets/js/chart-theme.js
          node --check site/assets/js/facilities.js
      - name: Run all tests after regeneration
        if: steps.changes.outputs.full_build == 'true'
        run: python -m pytest tests -q
      - name: Archive only generated changes for a publishing job
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pearson-correlations-20261108'
        run: |
          mkdir -p /tmp/unified-output
          cp -a site/data /tmp/unified-output/data
          cp -a index.html /tmp/unified-output/root-index.html
      - name: Upload verified generated output
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pearson-correlations-20261108'
        uses: actions/upload-artifact@v4
        with:
          name: verified-unified-regression-site
          path: /tmp/unified-output/
          retention-days: 2
          compression-level: 5

  stage-generated-data:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pearson-correlations-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: verified-unified-regression-site
          path: /tmp/unified-output
      - name: Synchronize only verified generated files
        run: |
          test -f /tmp/unified-output/data/unified_manifest.json
          test -f /tmp/unified-output/root-index.html
          rm -rf site/data
          cp -a /tmp/unified-output/data site/data
          cp /tmp/unified-output/root-index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: commit verified unified statsmodels JSON and Pages entry"
            git push origin HEAD:feat/pearson-correlations-20261108
          fi
