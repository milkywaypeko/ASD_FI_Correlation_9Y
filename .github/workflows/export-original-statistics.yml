name: Export original KOSIS statistics as ZIP

on:
  push:
    branches:
      - export/original-statistics-20261115
    paths:
      - .github/workflows/export-original-statistics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pinned source statistics
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create exact-source ZIP with provenance and extraction
        shell: bash
        run: |
          python - <<'PY'
          import bz2
          import csv
          import hashlib
          import io
          import zipfile
          from pathlib import Path

          source_commit = "c25122ab903e537156bb3072c36897608f37c837"
          root = Path("Statistics")
          originals = sorted(p for p in root.rglob("*") if p.is_file())
          data_files = [p for p in originals if p.suffix in (".csv", ".bz2")]
          assert len(originals) == 32, f"Expected 32 Statistics files; got {len(originals)}"
          assert len(data_files) == 31, f"Expected 31 data files; got {len(data_files)}"
          assert sum(p.suffix == ".csv" for p in data_files) == 30
          assert sum(p.suffix == ".bz2" for p in data_files) == 1

          hira_bz2 = next(p for p in originals if p.name.endswith("_cp949.csv.bz2"))
          hira_raw = bz2.decompress(hira_bz2.read_bytes())
          assert len(hira_raw) > 100_000
          assert hashlib.sha256(hira_raw).hexdigest() == (
              "52eecc3f3ebd598f552d154262314ed7524b0f89a244a07b9753bd583e0f03db"
          ), "Unexpected change to user-provided CP949 raw facility CSV"
          hira_csv_path = hira_bz2.with_suffix("")
          assert hira_csv_path.suffix == ".csv"
          assert not hira_csv_path.exists(), "Unexpected source file collision"

          docs = [Path("KOSIS_SOURCES.md"), Path("README.md"), Path("REPRODUCIBILITY.md")]
          assert all(p.is_file() for p in docs)
          entries = [(str(p.as_posix()), p.read_bytes(), "repo-original") for p in originals + docs]
          entries.append((hira_csv_path.as_posix(), hira_raw, "extracted-from-original-bz2"))
          assert len({name for name, _, _ in entries}) == len(entries)

          prefix = "ASD_FI_Correlation_9Y_Original_Statistics/"
          csv_buf = io.StringIO(newline="")
          writer = csv.writer(csv_buf)
          writer.writerow(["relative_path", "size_bytes", "sha256", "provenance"])
          for path, data, kind in entries:
              writer.writerow([path, len(data), hashlib.sha256(data).hexdigest(), kind])
          guide = f"""# 원본 통계자료 전용 ZIP

          **원본 저장소:** https://github.com/milkywaypeko/ASD_FI_Correlation_9Y
          **자료 기준 Git 커밋:** {source_commit}

          ## ZIP 내용
          - Statistics/의 원본 데이터 31개(일반 CSV 30개 + CP949 요양기관 CSV의 손실 없는 BZ2 압축 1개)
          - Statistics/README.md: 데이터 정의와 원본 경로
          - KOSIS_SOURCES.md: 기존 통계 30개 원표 + 요양기관 1개 출처 및 URL
          - README.md: 구현해야 할 회귀모형과 화면 요구사항 설명
          - REPRODUCIBILITY.md: 분석 및 데이터 재현 가이드
          - 요양기관 원본 CSV 1개를 BZ2에서 **바이트 그대로 복원**해 추가 수록
          - SOURCE_SHA256.csv: 모든 파일의 크기와 SHA-256 대조표

          이 ZIP에는 기존 실행 코드(build.py, JS), 사전 계산된 OLS JSON, HTML 결과물이 포함되지 않습니다.
          LLM이 이 ZIP만 입력받아 분석 엔진과 웹사이트를 처음부터 구현하기 위한 용도입니다.

          ## 분석 범위
          - 장애인등록 및 일반 지역 지표: 기본 2014–2022년
          - 진료비·건강보험료를 포함한 회귀: 2015–2022년
          - 요양기관 현황: **2014–2022년 각 1분기**, 정신병원은 2021–2022년
          - 전체 요양기관의 "계"는 원표의 공식 값을 이용하며 일부 기관 6종의 합으로 대체하지 않습니다.
          - 시설 밀도 = 해당 연도·지역 1분기 요양기관 수 / 같은 연도·지역 주민등록인구 × 100,000
          - 장애인 등록률 = 해당 연도·지역 장애유형 등록인원 / 주민등록인구 × 100
          - 원본 등록률은 실제 유병률이 아니고 상관관계는 인과관계가 아닙니다.

          ## 요양기관 공식 출처
          국민건강보험공단, 건강보험심사평가원,「건강보험통계」, 2026 2/4, 2026.11.11, 시군구별 종별 요양기관 현황
          https://kosis.kr/statHtml/statHtml.do?orgId=354&tblId=DT_HIRA4B&conn_path=I2
          인용문의 2026 2/4는 제공된 원본 파일의 실제 2014–2022년 관측열이 아닙니다.

          ## 인코딩·무결성
          - 원본 CSV는 원래의 바이트를 유지합니다. 인코딩을 임의로 변경하지 마세요.
          - 요양기관 원본 *.csv.bz2 및 추가로 풀어놓은 *.csv는 **CP949**입니다.
          - SOURCE_SHA256.csv에 각 원본 및 추출 파일의 무결성 해시가 있습니다.
          - 전체 ZIP 파일의 SHA-256은 ZIP 옆의 *.sha256 파일에서 확인합니다.
          """
          guide = "\n".join(line[10:] if line.startswith("          ") else line for line in guide.splitlines()) + "\n"
          entries.extend([
              ("SOURCE_SHA256.csv", csv_buf.getvalue().encode("utf-8-sig"), "generated-manifest"),
              ("START_HERE.md", guide.encode("utf-8"), "generated-guide"),
          ])

          destination = Path("artifacts/ASD_FI_Correlation_9Y_Original_Statistics.zip")
          destination.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(destination, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as out:
              for relpath, data, _ in entries:
                  info = zipfile.ZipInfo(prefix + relpath, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  out.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          with zipfile.ZipFile(destination) as z:
              assert z.testzip() is None, "ZIP CRC test failed"
              names = set(z.namelist())
              assert len(names) == len(entries)
              assert all(prefix + relpath in names for relpath, _, _ in entries)
              assert z.read(prefix + hira_csv_path.as_posix()) == hira_raw
              assert all(not name.endswith(".json.gz") for name in names)
          size = destination.stat().st_size
          checksum = hashlib.sha256(destination.read_bytes()).hexdigest()
          destination.with_suffix(".zip.sha256").write_text(f"{checksum}  {destination.name}\n", encoding="utf-8")
          print(f"Verified {len(data_files)} data sources, {len(entries)} archived files, ZIP {size:,} bytes")
          print(f"Original data bytes: {sum(p.stat().st_size for p in data_files):,}")
          print(f"ZIP SHA256: {checksum}")
          PY

      - name: Commit downloadable original-statistics archive to export branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ASD_FI_Correlation_9Y_Original_Statistics.zip artifacts/ASD_FI_Correlation_9Y_Original_Statistics.zip.sha256
          git commit -m "archive: verified original statistics ZIP [skip ci]"
          git push origin HEAD:refs/heads/export/original-statistics-20261115
