name: Verify new age and medical regression tabs
on:
  push:
    branches: [feature/age-medical-regression-ae31b48d]
    paths: ['.github/workflows/luna-verify-ae31b48d.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Run all existing and new tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q tests
      - name: Generate four new regression datasets in isolated output
        run: |
          python build.py --input . --output "$RUNNER_TEMP/expanded-site" > "$RUNNER_TEMP/build.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -n 12 "$RUNNER_TEMP/build.log"
      - name: Validate data coverage and regressions
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'expanded-site'/'data'
          audit=json.loads((root/'age_medical_quality.json').read_text())
          print("AUDIT",json.dumps({k:audit[k] for k in ('municipal_total','municipal_by_variable','municipal_complete_cases','province_by_variable','multi','age65','under15','medical')},ensure_ascii=False))
          assert audit['municipal_by_variable']['age65_percent']>1000
          assert audit['municipal_by_variable']['under15_percent']>1000
          assert audit['municipal_by_variable']['medical_10k_per_person']>1000
          assert audit['municipal_complete_cases']['after']>1000
          for prefix in ('demographic_multi_models_2022_after','age65_ols_models_2022','under15_ols_models_2022','medical_ols_models_2022'):
              models=json.loads((root/(prefix+'.json')).read_text())
              national=next(m for m in models if m['scope']=='municipal' and m['region']=='전국')
              print(prefix,'n=',national['n'],'r2=',national['r2'],'warning=',national['warning'])
              assert national['intercept'] is not None
          PY
