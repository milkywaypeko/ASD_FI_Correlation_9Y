name: Build and publish full statsmodels summaries 907bc7
on:
  push:
    branches: [feature/full-statsmodels-summaries-907bc7]
    paths: ['.github/workflows/luna-publish-907bc7.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Test statsmodels summaries and existing features
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q tests
      - name: Regenerate site with unabridged statsmodels summaries
        shell: bash
        run: |
          python -u build.py --input . --output "$RUNNER_TEMP/full-site" > "$RUNNER_TEMP/build.log" 2>&1 || { tail -n 90 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -n 12 "$RUNNER_TEMP/build.log"
      - name: Verify every fitted model and archive exactly 64 generated JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,tarfile
          from collections import Counter
          data=pathlib.Path(os.environ['RUNNER_TEMP'])/'full-site'/'data'
          files=sorted(data.glob('*_type_??.json'))
          assert len(files)==64, len(files)
          names=set()
          counts=Counter()
          snippets=('OLS Regression Results','R-squared:', 'Adj. R-squared:', 'F-statistic:',
                    'Prob (F-statistic):','Log-Likelihood:', 'coef', 'std err', 'P>|t|',
                    'Omnibus:', 'Durbin-Watson:', 'Jarque-Bera', 'Skew:', 'Kurtosis:',
                    'Cond. No.', 'Notes:')
          for path in files:
              names.add(path.name)
              payload=json.loads(path.read_text(encoding='utf-8'))
              assert payload['type'] != '전체'
              for model in payload['models']:
                  raw=model['raw']
                  if model['intercept'] is None:
                      assert raw is None
                      counts['unfitted']+=1
                  else:
                      assert raw is not None,(path,model)
                      for token in snippets:
                          assert token in raw,(path.name,model['year'],model['scope'],token)
                      assert not raw.startswith('OLS /')
                      counts['fitted']+=1
          assert counts['fitted']>28000,counts
          for prefix in ('demographic_multi_models','age65_ols_models',
                         'under15_ols_models','medical_ols_models'):
              expected={f'{prefix}_type_{n:02d}.json' for n in range(1,17)}
              assert expected <= names
              sample=json.loads((data/f'{prefix}_type_08.json').read_text(encoding='utf-8'))
              models=[x for x in sample['models'] if x['year']==2022
                      and x['scope']=='municipal' and x['region']=='전국'
                      and (x['mode']=='after' or x['mode'] is None)]
              assert len(models)==1 and models[0]['n']==227
              assert 'OLS Regression Results' in models[0]['raw']
              print(prefix, '자폐성 2022 n=',models[0]['n'])
          print('VERIFIED',dict(counts),'type JSON files',len(files))
          with tarfile.open('typed-summaries.tar.gz','w:gz') as archive:
              for path in files:
                  archive.add(path,arcname='site/data/'+path.name)
          PY
          sha256sum typed-summaries.tar.gz > typed-summaries.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: statsmodels-tables-907bc7
          path: |
            typed-summaries.tar.gz
            typed-summaries.sha256
          retention-days: 1
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: statsmodels-tables-907bc7
      - name: Verify artifact checksum and exact branch source
        shell: bash
        run: |
          sha256sum -c typed-summaries.sha256
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git ls-remote origin refs/heads/feature/full-statsmodels-summaries-907bc7 | cut -f1)" = "${{ github.sha }}"
          python - <<'PY'
          import tarfile
          with tarfile.open('typed-summaries.tar.gz','r:gz') as t:
              names=t.getnames()
              assert len(names)==64,len(names)
              assert all(n.startswith('site/data/') and
                         '/' not in n[len('site/data/'):] and
                         n.endswith('.json') and '_type_' in n for n in names)
          PY
          tar -xzf typed-summaries.tar.gz
      - name: Commit only the verified type-specific data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git add site/data/*_type_*.json
          test "$(git diff --cached --name-only | wc -l)" -eq 64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: publish complete statsmodels OLS tables for 16 disability types'
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/feature/full-statsmodels-summaries-907bc7
