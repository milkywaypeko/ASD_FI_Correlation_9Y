name: Verify and publish household insurance regressions
on:
  push:
    branches: [feature/household-premium-regressions-20261107]
    paths: ['.github/workflows/temporary-household-apply.yml']
permissions:
  contents: write
concurrency:
  group: household-analysis-20261107
  cancel-in-progress: false
jobs:
  apply-build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate immutable input archives and reconstruct organized sources
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'd2f3c5183fe61627d4fd33121c07ce89aa1c1fcc4102f7db0db493e74da41799  .mission/code-only.tar.xz' | sha256sum -c
          echo '027d480011b375a858306f66992e12116756d5276977098bc09376e719dcabc9  .mission/data-only.tar.xz' | sha256sum -c
          python - <<'PY'
          import tarfile,shutil
          from pathlib import Path
          root=Path.cwd()
          for filename,expected in (('.mission/code-only.tar.xz',23),
                                    ('.mission/data-only.tar.xz',5)):
              with tarfile.open(filename,'r:xz') as tar:
                  members=tar.getmembers()
                  assert len(members)==expected,(filename,len(members))
                  assert all(x.isfile() and not x.name.startswith('/')
                             and '..' not in Path(x.name).parts for x in members)
          stats=root/'Statistics'
          moves=[('Birth rate.csv','출산율/Birth rate.csv'),
                 ('Financial Independence.csv','재정/Financial Independence.csv'),
                 ('Resident population.csv','인구/Resident population.csv'),
                 ('연령(5세)별 주민등록연앙인구.csv','인구/연령(5세)별 주민등록연앙인구.csv')]
          for src,dst in moves:
              target=stats/dst
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.move(str(stats/src),str(target))
          target=stats/'장애인등록'/'Disability'
          target.parent.mkdir(parents=True,exist_ok=True)
          assert len(list((stats/'Disability').glob('*.csv')))==17
          shutil.move(str(stats/'Disability'),str(target))
          med=sorted(stats.glob('시군구*연령별 진료현황-전체.csv'))
          assert len(med)==4,med
          target=stats/'국가건강정보'/'진료비'
          target.mkdir(parents=True,exist_ok=True)
          for source in med:
              shutil.move(str(source),str(target/source.name))
          for filename in ('.mission/code-only.tar.xz','.mission/data-only.tar.xz'):
              with tarfile.open(filename,'r:xz') as tar:
                  tar.extractall(path=root,filter='data')
          assert len(list((stats/'국가건강정보'/'보험료').glob('*.csv')))==4
          assert (stats/'인구'/'행정구역(시군구)별 주민등록세대수.csv').is_file()
          print('All original CSV files are reorganized; source copies untouched.')
          PY
      - name: Install requirements and run all regression tests
        shell: bash
        run: |
          python -m pip install -r requirements.txt pytest
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q tests
      - name: Generate all site/data and site/raw models from CSV
        shell: bash
        run: |
          python -u build.py --input . --output site > "$RUNNER_TEMP/household-build.log" 2>&1 || { tail -n 90 "$RUNNER_TEMP/household-build.log"; exit 1; }
          tail -n 16 "$RUNNER_TEMP/household-build.log"
      - name: Verify actual insurance denominators, coefficients, and all disability types
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          data=pathlib.Path('site/data')
          audit=json.loads((data/'age_medical_quality.json').read_text(encoding='utf-8'))
          assert audit['household_available']==2187,audit['household_available']
          assert audit['premium_source_invalid_count']==101
          assert audit['municipal_by_variable']['premium_10k_per_household']==1968
          assert audit['municipal_complete_cases']['after']==1959
          assert audit['premium_missing_households_warning'] is None
          types=list(data.glob('*_type_??.json'))
          assert len(types)==96,len(types)
          for pfx in ('household_premium_ols_models','household_premium_multi_models'):
              file=data/(pfx+'_2022'+('_after' if pfx.endswith('_multi_models') else '')+'.json')
              models=json.loads(file.read_text(encoding='utf-8'))
              nationwide=next(m for m in models if m['scope']=='municipal' and m['region']=='전국')
              expected=227 if pfx.endswith('_multi_models') else 228
              assert nationwide['n']==expected, (file,nationwide['n'])
              assert nationwide['coefficients'].get('premium_10k_per_household') is not None
              assert 'OLS Regression Results' in nationwide['raw']
              autistic=json.loads((data/(pfx+'_type_08.json')).read_text(encoding='utf-8'))
              sample=next(m for m in autistic['models'] if m['year']==2022 and m['scope']=='municipal' and m['region']=='전국' and (m['mode']=='after' or m['mode'] is None))
              assert sample['n']==expected and 'OLS Regression Results' in sample['raw']
              print(file.name,'national n',nationwide['n'],'R²',nationwide['r2'])
          rows=json.loads((data/'municipalities.json').read_text(encoding='utf-8'))
          k=next(r for r in rows if (r['year'],r['province'],r['district'])==(2022,'서울특별시','종로구'))
          assert abs(k['premium_10k_per_household']-411.438114279411)<1e-8,k
          print('VERIFIED 43 tests, 96 disability-type model files; insurance fully normalized per registered household.')
          PY
      - name: Commit and push verified complete source and static site
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git ls-remote origin refs/heads/feature/household-premium-regressions-20261107 | cut -f1)" = "$GITHUB_SHA"
          rm -f .github/workflows/temporary-household-transport.yml .github/workflows/temporary-household-apply.yml
          rm -f .mission/code-only.tar.xz .mission/data-only.tar.xz
          rmdir .mission 2>/dev/null || true
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -c '^Statistics/국가건강정보/보험료/')" -eq 4
          test "$(git diff --cached --name-only | grep -c 'household-premium-ols.html')" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: per-household NHIS premiums, sixth regression predictor and categorized statistics'
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/feature/household-premium-regressions-20261107
