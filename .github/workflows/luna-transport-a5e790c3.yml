name: Transport exact source tree a5e790c3
on:
  push:
    branches: [feature/disability-type-age-medical-a5e790c3]
    paths: ['.github/workflows/luna-transport-a5e790c3.yml']
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a10e64b5c034e896a3f7afb34b6f8c93e4d3120b
          persist-credentials: false
      - name: Archive exact source commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a10e64b5c034e896a3f7afb34b6f8c93e4d3120b"
          git archive --format=tar HEAD | gzip -6 > source.tar.gz
          echo "a10e64b5c034e896a3f7afb34b6f8c93e4d3120b" > source.sha
          sha256sum source.tar.gz > source.tar.gz.sha256
          du -h source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: exact-source-a5e790c3
          path: |
            source.tar.gz
            source.sha
            source.tar.gz.sha256
          retention-days: 1
